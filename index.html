<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Milestone</title>
    <style>
      [id*="smartsupp"],
      [class*="smartsupp"],
      iframe[src*="smartsupp"] {
        position: fixed !important;
        bottom: 180px !important;
        right: 16px !important;
        z-index: 9999 !important;
      }
    </style>
    <script>
  const repositionSmartsupp = () => {
    const btn = document.querySelector('[data-testid="widgetButton"], [aria-label="Open Smartsupp chat"]');
    if (!btn) return;

    // Walk up to the fixed-position wrapper that actually controls placement
    const container = btn.closest('.fixed') || btn.parentElement;
    if (container) {
      container.style.setProperty('bottom', '180px', 'important');
      container.style.setProperty('right', '16px', 'important');
      container.style.setProperty('z-index', '9999', 'important');
    }
  };

  const initSmartsuppPositioning = () => {
    repositionSmartsupp();
    const observer = new MutationObserver(repositionSmartsupp);
    observer.observe(document.body, {
      childList: true,
      subtree: true,
      attributes: true,
      attributeFilter: ['style', 'class']
    });
    setInterval(repositionSmartsupp, 1000);
  };

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initSmartsuppPositioning);
  } else {
    initSmartsuppPositioning();
  }
</script>
  </head>
  <body>
    <div id="root"></div>

    <!-- Smartsupp Live Chat script -->
    <script type="text/javascript">
    var _smartsupp = _smartsupp || {};
    _smartsupp.key = '8758c55d7e7bc53731cd5fb1466f42b437e3dc77';
    window.smartsupp||(function(d) {
     var s,c,o=smartsupp=function(){ o._.push(arguments)};o._=[];
     s=d.getElementsByTagName('script')[0];c=d.createElement('script');
     c.type='text/javascript';c.charset='utf-8';c.async=true;
     c.src='https://www.smartsuppchat.com/loader.js?';s.parentNode.insertBefore(c,s);
    })(document);
    </script>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
