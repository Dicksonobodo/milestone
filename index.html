<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Milestone</title>
    <style>
      /* Keep the Smartsupp launcher above the bottom navigation */
      [id*="smartsupp"],
      [class*="smartsupp"],
      iframe[src*="smartsupp"] {
        bottom: 120px !important;
        right: 16px !important;
        z-index: 9999 !important;
      }
    </style>
    <script>
      const repositionSmartsupp = () => {
        const candidates = document.querySelectorAll(
          'iframe[src*="smartsupp"], div[id*="smartsupp"], div[class*="smartsupp"], [id*="smartsupp-widget"], [class*="smartsupp-widget"]'
        );

        candidates.forEach((el) => {
          el.style.setProperty('bottom', '120px', 'important');
          el.style.setProperty('right', '16px', 'important');
          el.style.setProperty('z-index', '9999', 'important');
        });
      };

      const initSmartsuppPositioning = () => {
        repositionSmartsupp();
        const observer = new MutationObserver(repositionSmartsupp);
        observer.observe(document.body, { childList: true, subtree: true });
      };

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initSmartsuppPositioning);
      } else {
        initSmartsuppPositioning();
      }
    </script>
  </head>
  <body>
    <div id="root"></div>

    <!-- Smartsupp Live Chat script -->
    <script type="text/javascript">
    var _smartsupp = _smartsupp || {};
    _smartsupp.key = '8758c55d7e7bc53731cd5fb1466f42b437e3dc77';
    window.smartsupp||(function(d) {
     var s,c,o=smartsupp=function(){ o._.push(arguments)};o._=[];
     s=d.getElementsByTagName('script')[0];c=d.createElement('script');
     c.type='text/javascript';c.charset='utf-8';c.async=true;
     c.src='https://www.smartsuppchat.com/loader.js?';s.parentNode.insertBefore(c,s);
    })(document);
    </script>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
